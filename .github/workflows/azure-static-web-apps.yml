name: Azure Static Web Apps CI/CD
 
on:
  push:
    branches:
      - main   # deploy when pushing to main branch
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
 
jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy React TSX to Azure Static Web Apps
    steps:
   
      # 2️⃣ Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
 
      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm install
 
      # 4️⃣ Build the project with env variable
      - name: Build project
        run: npm run build
        env:
          VITE_API_BASE_URL: https://hrpoc-fqbvc9g7gtdrb9be.southindia-01.azurewebsites.net   # << Your backend URL here
 
      # 5️⃣ Deploy to Azure Static Web Apps
      - name: Deploy to Azure Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # used for PR comments
          action: "upload"
          app_location: "/"              # Root of your app
          output_location: "dist"        # For Vite; if CRA, use "build"
          api_location: ""               # Leave empty since backend is separate